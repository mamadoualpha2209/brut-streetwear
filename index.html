<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRUT. — Streetwear</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0a'/%3E%3Ctext x='32' y='44' font-family='Arial Narrow,Impact,sans-serif' font-weight='700' font-size='36' fill='%23e8ff3c' text-anchor='middle'%3EB.%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0a0a0a;--paper:#ffffff;--surface:#f3f3f1;--line-soft:#dcdcd8;
    --accent:#e8ff3c;--accent-ink:#0a0a0a;--grey:#6f6f6b;--danger:#c94b3c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Arial Narrow',Impact,'Haettenschweiler',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.01em;line-height:0.92;}
  .mono{font-family:ui-monospace,'Courier New',Courier,monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  img{max-width:100%;display:block;}

  .ticker-wrap{background:var(--ink);color:var(--paper);overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--ink);}
  .ticker{display:inline-block;padding:8px 0;animation:scroll 22s linear infinite;font-family:ui-monospace,'Courier New',monospace;font-size:12px;letter-spacing:0.12em;}
  .ticker span{margin:0 28px;}
  @keyframes scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

  header.site{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--ink);}
  .nav{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:16px;}
  .logo{font-family:'Arial Narrow',Impact,sans-serif;font-size:26px;letter-spacing:0.02em;background:none;border:none;padding:0;}
  .logo .dot{color:var(--accent);-webkit-text-stroke:1px var(--ink);}
  nav.links{display:flex;gap:28px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;align-items:center;}
  nav.links button{background:none;border:none;font:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit;color:inherit;padding:0;}
  nav.links button.active{color:var(--grey);text-decoration:underline;text-underline-offset:5px;}
  nav.links button:hover{color:var(--grey);}
  .currency-pick{font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--ink);background:var(--paper);padding:4px 6px;}
  .nav-right{display:flex;align-items:center;gap:16px;}
  .icon-btn{background:none;border:none;padding:6px;position:relative;display:flex;align-items:center;}
  .cart-count{position:absolute;top:-2px;right:-2px;background:var(--accent);color:var(--accent-ink);font-family:ui-monospace,monospace;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--ink);}

  .btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent);padding:14px 26px;font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;transition:all .15s ease;}
  .btn:hover{background:transparent;color:var(--ink);border-color:var(--ink);}
  .btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.dark:hover{background:transparent;color:var(--ink);}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);}
  .btn.ghost:hover{background:var(--ink);color:var(--paper);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;background:var(--surface);border-color:var(--line-soft);color:var(--grey);}

  .page{max-width:1280px;margin:0 auto;padding:40px 24px 90px;min-height:60vh;}
  .page-head{margin-bottom:28px;}
  .page-head h1{font-size:clamp(32px,5vw,56px);margin:0 0 8px;}
  .page-head .breadcrumb{font-family:ui-monospace,monospace;font-size:11px;color:var(--grey);letter-spacing:0.08em;text-transform:uppercase;}
  .page-head .breadcrumb button{background:none;border:none;font:inherit;color:inherit;padding:0;cursor:pointer;}
  .page-head .breadcrumb button:hover{color:var(--ink);text-decoration:underline;}

  .hero{position:relative;background:var(--ink);color:var(--paper);padding:90px 24px 70px;overflow:hidden;}
  .hero-inner{max-width:1280px;margin:0 auto;position:relative;z-index:2;}
  .hero-tag{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-family:ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:0.1em;padding:6px 12px;transform:rotate(-2deg);margin-bottom:22px;}
  .hero h1{font-size:clamp(48px,9vw,120px);margin:0;}
  .hero h1 .outline{-webkit-text-stroke:2px var(--paper);color:transparent;}
  .hero p.sub{max-width:420px;margin:22px 0 30px;color:#c9c9c4;font-size:15px;line-height:1.6;}
  .hazard{position:absolute;inset:0;opacity:0.06;background:repeating-linear-gradient(45deg,var(--paper) 0 14px, transparent 14px 28px);pointer-events:none;}

  .cat-strip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:26px;}
  .cat-strip .label{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.1em;color:var(--grey);margin-right:8px;}
  .chip{border:2px solid var(--ink);padding:8px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;background:var(--paper);}
  .chip.active{background:var(--ink);color:var(--paper);}
  .chip:hover{background:var(--ink);color:var(--paper);}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--ink);border:2px solid var(--ink);}
  .card{background:var(--paper);position:relative;overflow:hidden;}
  .card .swatch{aspect-ratio:3/4;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--surface);cursor:pointer;}
  .card .swatch img{width:100%;height:100%;object-fit:cover;}
  .card:not(.out) .swatch:hover{background:var(--ink);}
  .swatch svg{width:44%;transition:transform .25s ease;}
  .card:not(.out) .swatch:hover svg{transform:scale(1.08);}
  .card.out .swatch{opacity:0.5;cursor:default;}
  .badge{position:absolute;top:12px;left:-30px;background:var(--accent);color:var(--accent-ink);font-family:ui-monospace,monospace;font-size:10px;font-weight:700;padding:4px 34px;transform:rotate(-8deg);letter-spacing:0.06em;z-index:3;}
  .badge.stock-out{background:var(--ink);color:var(--paper);}
  .card-body{padding:14px 16px 16px;border-top:2px solid var(--ink);}
  .card-cat{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.1em;color:var(--grey);text-transform:uppercase;}
  .card-name-btn{background:none;border:none;padding:0;text-align:left;cursor:pointer;}
  .card-name{font-size:14px;font-weight:700;margin:4px 0 6px;text-transform:uppercase;letter-spacing:0.02em;}
  .card-name-btn:hover .card-name{text-decoration:underline;}
  .swatch-dots{display:flex;gap:4px;margin-bottom:8px;}
  .swatch-dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--ink);}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card-price{font-family:ui-monospace,monospace;font-weight:700;font-size:14px;}
  .old-price{text-decoration:line-through;color:var(--grey);font-weight:400;font-size:12px;}
  .discount-tag{background:var(--accent);color:var(--accent-ink);font-size:10px;padding:2px 6px;font-weight:700;}
  .delivery-banner{background:var(--surface);border:1px solid var(--line-soft);padding:12px 16px;font-size:13px;margin:16px 0;}
  .stock-tag{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--ink);}
  .stock-tag.in{background:var(--accent);}
  .stock-tag.out{background:var(--surface);color:var(--grey);border-color:var(--line-soft);}
  .add-btn{border:2px solid var(--ink);background:var(--paper);padding:8px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;transition:all .15s ease;width:100%;margin-top:10px;}
  .add-btn:hover{background:var(--accent);border-color:var(--accent);}
  .add-btn:disabled{opacity:0.4;cursor:not-allowed;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .section-head .count{font-family:ui-monospace,monospace;font-size:12px;color:var(--grey);}

  .product-detail{display:grid;grid-template-columns:1fr 1fr;gap:50px;}
  .pd-swatch{aspect-ratio:1/1;background:var(--surface);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pd-swatch svg{width:40%;}
  .pd-swatch img{width:100%;height:100%;object-fit:cover;}
  .pd-info .cat{font-family:ui-monospace,monospace;font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;}
  .pd-info h1{font-size:clamp(28px,4vw,44px);margin:0 0 14px;}
  .pd-price{font-family:ui-monospace,monospace;font-size:26px;font-weight:700;margin-bottom:16px;}
  .pd-stock{margin-bottom:18px;}
  .pd-colors{margin-bottom:20px;}
  .pd-colors .label{font-family:ui-monospace,monospace;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .color-row{display:flex;gap:8px;flex-wrap:wrap;}
  .accordion{max-width:640px;border-top:2px solid var(--ink);}
  .accordion-item{border-bottom:1px solid var(--line-soft);}
  .accordion-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:none;padding:18px 4px;text-align:left;font-size:15px;font-weight:700;cursor:pointer;}
  .accordion-q:hover{color:var(--grey);}
  .accordion-icon{font-family:ui-monospace,monospace;font-size:18px;flex-shrink:0;}
  .accordion-a{padding:0 4px 18px;color:var(--grey);font-size:14px;line-height:1.7;}
  .accordion-a.hidden{display:none;}
  .color-check-row{display:flex;gap:10px;flex-wrap:wrap;}
  .color-check{display:flex;align-items:center;gap:7px;border:2px solid var(--ink);padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .color-check:hover{background:var(--surface);}
  .color-check input{width:15px;height:15px;}
  .color-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:5px 10px;font-size:11px;}
  .pd-desc{color:var(--grey);font-size:14px;line-height:1.7;margin-bottom:28px;max-width:440px;}

  .cart-table{width:100%;border-collapse:collapse;margin-bottom:30px;}
  .cart-table th{text-align:left;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey);padding-bottom:12px;border-bottom:2px solid var(--ink);}
  .cart-table td{padding:16px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  .ct-product{display:flex;gap:14px;align-items:center;}
  .ct-thumb{width:56px;height:66px;background:var(--surface);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .ct-thumb svg{width:60%;}
  .ct-thumb img{width:100%;height:100%;object-fit:cover;}
  .ct-name{font-weight:700;font-size:13px;text-transform:uppercase;}
  .qty-row{display:flex;align-items:center;gap:10px;}
  .qty-btn{width:24px;height:24px;border:1px solid var(--ink);background:none;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .qty-val{font-family:ui-monospace,monospace;font-size:12px;min-width:16px;text-align:center;}
  .remove-link{font-family:ui-monospace,monospace;font-size:10px;color:var(--grey);text-decoration:underline;background:none;border:none;cursor:pointer;}
  .cart-summary{max-width:340px;margin-left:auto;border:2px solid var(--ink);padding:22px;}
  .total-row{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:16px;text-transform:uppercase;}
  .total-row .val{font-family:ui-monospace,monospace;}
  .empty-cart{text-align:center;padding:80px 20px;color:var(--grey);}

  .checkout-grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:50px;align-items:start;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:6px;}
  .field input, .field select{width:100%;border:2px solid var(--ink);padding:11px 12px;font-family:inherit;font-size:14px;background:var(--paper);}
  .field input:focus, .field select:focus{outline:none;background:var(--surface);}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}
  .order-recap{border:2px solid var(--ink);padding:22px;}
  .order-recap h4{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;margin:0 0 16px;}
  .recap-line{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line-soft);}

  .pay-options{display:flex;flex-direction:column;gap:10px;}
  .pay-option{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);padding:12px 14px;cursor:pointer;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;}
  .pay-option:hover{background:var(--surface);}
  .pay-option input{width:16px;height:16px;}
  .pay-option .pay-icon{margin-left:auto;font-family:ui-monospace,monospace;font-size:10px;color:var(--grey);letter-spacing:0.05em;}
  .pay-details{border:1px dashed var(--line-soft);padding:16px;margin-top:10px;background:var(--surface);}
  .pay-details.hidden{display:none;}
  .pay-note{font-size:11px;color:var(--grey);margin-top:8px;line-height:1.5;}

  .confirm-box{text-align:center;padding:60px 20px;max-width:460px;margin:0 auto;}
  .confirm-box .icon{font-size:52px;margin-bottom:14px;}
  .confirm-box .order-id{font-family:ui-monospace,monospace;background:var(--surface);padding:10px 16px;display:inline-block;margin:16px 0;font-size:14px;border:1px solid var(--line-soft);}
  .confirm-box .pay-summary{font-family:ui-monospace,monospace;font-size:12px;color:var(--grey);margin-top:6px;}

  .admin-grid{display:grid;grid-template-columns:1fr 340px;gap:40px;align-items:start;}
  .admin-table{width:100%;border-collapse:collapse;}
  .admin-table th{text-align:left;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey);padding-bottom:10px;border-bottom:2px solid var(--ink);}
  .admin-table td{padding:12px 8px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle;}
  .admin-prod{display:flex;align-items:center;gap:10px;}
  .admin-thumb{width:40px;height:48px;background:var(--surface);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .admin-thumb svg{width:60%;}
  .admin-thumb img{width:100%;height:100%;object-fit:cover;}
  .toggle-btn{font-family:ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 12px;border:2px solid var(--ink);background:var(--paper);}
  .toggle-btn.in{background:var(--accent);}
  .toggle-btn.out{background:var(--ink);color:var(--paper);}
  .del-btn{font-family:ui-monospace,monospace;font-size:10px;color:var(--danger);background:none;border:none;text-decoration:underline;cursor:pointer;margin-left:8px;}
  .admin-form{border:2px solid var(--ink);padding:22px;margin-bottom:24px;}
  .admin-form h3{font-size:20px;margin:0 0 4px;}
  .admin-form .sub{font-family:ui-monospace,monospace;font-size:11px;color:var(--grey);margin-bottom:18px;}
  .checkbox-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .checkbox-row input{width:18px;height:18px;}
  .checkbox-row label{font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;}
  .admin-note{background:var(--surface);border:1px solid var(--line-soft);padding:12px 14px;font-size:12px;color:var(--grey);margin-bottom:20px;line-height:1.6;}
  .img-preview{width:80px;height:96px;border:1px solid var(--line-soft);background:var(--surface);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:8px;}
  .img-preview img{width:100%;height:100%;object-fit:cover;}

  .lock-screen{max-width:380px;margin:80px auto;text-align:center;padding:40px 30px;border:2px solid var(--ink);}
  .lock-screen h1{font-size:24px;margin:14px 0 6px;}
  .lock-screen p{color:var(--grey);font-size:13px;margin-bottom:20px;}

  /* ---- Galerie produit + zoom ---- */
  .pd-gallery{display:flex;flex-direction:column;gap:10px;}
  .pd-main-wrap{position:relative;}
  .pd-swatch{aspect-ratio:1/1;background:var(--surface);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;}
  .pd-swatch svg{width:40%;}
  .pd-swatch img{width:100%;height:100%;object-fit:cover;}
  .pd-zoom-hint{position:absolute;bottom:10px;right:10px;background:var(--ink);color:var(--paper);font-family:ui-monospace,monospace;font-size:10px;padding:5px 9px;letter-spacing:0.05em;pointer-events:none;opacity:0.85;}
  .pd-thumbs{display:flex;gap:8px;flex-wrap:wrap;}
  .pd-thumb{width:64px;height:76px;border:2px solid var(--line-soft);background:var(--surface);cursor:pointer;overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center;}
  .pd-thumb img{width:100%;height:100%;object-fit:cover;}
  .pd-thumb.active{border-color:var(--ink);}
  .lightbox{position:fixed;inset:0;background:rgba(10,10,10,0.94);z-index:200;display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;}
  .lightbox-close{position:absolute;top:20px;right:24px;background:none;border:2px solid var(--paper);color:var(--paper);width:38px;height:38px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:2px solid var(--paper);color:var(--paper);width:42px;height:42px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lightbox-prev{left:20px;}
  .lightbox-next{right:20px;}

  /* ---- Sélecteur de taille ---- */
  .pd-sizes{margin-bottom:20px;}
  .pd-sizes .label{font-family:ui-monospace,monospace;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .size-row{display:flex;gap:8px;flex-wrap:wrap;}
  .size-opt{border:2px solid var(--ink);min-width:46px;padding:9px 10px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;background:var(--paper);position:relative;}
  .size-opt:hover{background:var(--surface);}
  .size-opt.selected{background:var(--ink);color:var(--paper);}
  .size-opt.disabled{opacity:0.35;cursor:not-allowed;text-decoration:line-through;background:var(--surface);}
  .size-opt .size-qty{display:block;font-family:ui-monospace,monospace;font-size:9px;font-weight:400;margin-top:2px;color:var(--grey);}
  .size-opt.selected .size-qty{color:#c9c9c4;}

  /* ---- Admin : tailles & multi-photos ---- */
  .admin-sizes-input{display:flex;flex-direction:column;gap:8px;}
  .admin-size-row{display:flex;gap:8px;align-items:center;}
  .admin-size-row input[type="text"]{flex:1;}
  .admin-size-row input[type="number"]{width:80px;}
  .admin-size-row button{background:none;border:1px solid var(--line-soft);width:30px;height:38px;font-size:16px;cursor:pointer;flex-shrink:0;}
  .admin-size-row button:hover{border-color:var(--danger);color:var(--danger);}
  .admin-add-size-btn{border:2px dashed var(--line-soft);background:none;padding:9px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;}
  .admin-add-size-btn:hover{border-color:var(--ink);}
  .img-preview-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .img-preview-item{position:relative;width:70px;height:84px;border:1px solid var(--line-soft);background:var(--surface);overflow:hidden;}
  .img-preview-item img{width:100%;height:100%;object-fit:cover;}
  .img-preview-item button{position:absolute;top:2px;right:2px;background:var(--ink);color:var(--paper);border:none;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer;}

  .pagination{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:32px;flex-wrap:wrap;}
  .page-nav{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:none;border:2px solid var(--ink);padding:9px 16px;cursor:pointer;}
  .page-nav:hover{background:var(--ink);color:var(--paper);}
  .page-nav:disabled{opacity:0.3;cursor:not-allowed;background:none;color:inherit;}
  .page-nums{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}

function formatPrice(priceGNF){
  const c = CURRENCIES[currentCurrency] || CURRENCIES.GNF;
  const amount = priceGNF * (c.rateFromEUR / GNF_PER_EUR);
  const rounded = c.decimals === 0 ? Math.round(amount).toLocaleString('fr-FR') : amount.toFixed(c.decimals);
  return c.position === 'before' ? `${c.symbol}${rounded}` : `${rounded} ${c.symbol}`;
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('lecture impossible'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image invalide'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);

        // Compression progressive : on vise un fichier final léger (~150 Ko max)
        // en réduisant la qualité, puis si besoin la dimension, jusqu'à repasser sous le seuil.
        const TARGET_BYTES = 150000;
        let q = quality;
        let dataUrl = canvas.toDataURL('image/jpeg', q);
        let attempts = 0;
        while(dataUrl.length * 0.75 > TARGET_BYTES && attempts < 6){
          q = Math.max(0.2, q - 0.15);
          dataUrl = canvas.toDataURL('image/jpeg', q);
          attempts++;
        }
        if(dataUrl.length * 0.75 > TARGET_BYTES){
          // dernier recours : on réduit aussi les dimensions
          const smallerCanvas = document.createElement('canvas');
          smallerCanvas.width = Math.round(w*0.6);
          smallerCanvas.height = Math.round(h*0.6);
          smallerCanvas.getContext('2d').drawImage(canvas, 0, 0, smallerCanvas.width, smallerCanvas.height);
          dataUrl = smallerCanvas.toDataURL('image/jpeg', 0.5);
        }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  }catch(e){

  }
}

// Échappe le HTML pour empêcher toute injection (XSS stocké) via des champs
// texte (nom produit, description, couleurs, réglages admin, etc.)
function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

// Découpe une liste en pages de PAGE_SIZE éléments, en corrigeant la page demandée si hors limites
function paginate(list, page){
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const safePage = Math.min(Math.max(1, page), totalPages);
  const start = (safePage - 1) * PAGE_SIZE;
  return { items: list.slice(start, start + PAGE_SIZE), page: safePage, totalPages, total: list.length };
}
// Barre de pagination réutilisable : « Précédent  1 2 3  Suivant »
function renderPagination(page, totalPages, attr){
  if(totalPages <= 1) return '';
  let nums = '';
  for(let i=1; i<=totalPages; i++){
    nums += `<button class="page-num ${i===page?'active':''}" data-${attr}="${i}">${i}</button>`;
  }
  return `
    <div class="pagination">
      <button class="page-nav" data-${attr}="${page-1}" ${page<=1?'disabled':''}>← Précédent</button>
      <div class="page-nums">${nums}</div>
      <button class="page-nav" data-${attr}="${page+1}" ${page>=totalPages?'disabled':''}>Suivant →</button>
    </div>
  `;
}

// ================= ACTIONS =================
async function addToCart(id, color, size){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p || !productInStock(p)) return;
  if(p.sizes && p.sizes.length){
    if(!size || sizeQty(p, size) <= 0) return; // taille obligatoire et disponible pour un article avec tailles
  }
  const item = cart.find(c=>c.id===id && (c.color||null)===(color||null) && (c.size||null)===(size||null));
  if(item) item.qty += 1; else cart.push({id, color: color||null, size: size||null, qty:1});
  await saveCart();
  updateCartCount();
}
async function addToCartWithColors(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p || !productInStock(p)) return;
  const hasSizes = p.sizes && p.sizes.length > 0;
  if(hasSizes && (!pdSelectedSize || sizeQty(p, pdSelectedSize) <= 0)){
    alert('Merci de choisir une taille disponible.');
    return;
  }
  const size = hasSizes ? pdSelectedSize : null;
  const checked = Array.from(document.querySelectorAll('.pd-color-cb:checked')).map(cb=>cb.value);
  if(p.colors && p.colors.length && checked.length===0){
    alert('Merci de choisir au moins une couleur.');
    return;
  }
  if(checked.length){
    for(const color of checked){ await addToCart(id, color, size); }
  } else {
    await addToCart(id, null, size);
  }
  navigate('cart');
}
async function changeQty(id, color, size, delta){
  const item = cart.find(c=>c.id===id && (c.color||null)===(color||null) && (c.size||null)===(size||null));
  if(!item) return;
  item.qty += delta;
  if(item.qty<=0) cart = cart.filter(c=>c!==item);
  await saveCart();
  render();
}
async function removeItem(id, color, size){
  cart = cart.filter(c=>!(c.id===id && (c.color||null)===(color||null) && (c.size||null)===(size||null)));
  await saveCart();
  render();
}
async function submitOrder(){
  const name = document.getElementById('ckName').value.trim().slice(0, 100);
  const email = document.getElementById('ckEmail').value.trim().slice(0, 150);
  const address = document.getElementById('ckAddress').value.trim().slice(0, 200);
  const city = document.getElementById('ckCity').value.trim().slice(0, 100);
  const phone = document.getElementById('ckPhone').value.trim().slice(0, 30);
  if(!name || !email || !address){
    alert("Merci de remplir au moins le nom, l'email et l'adresse.");
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    alert("Merci de renseigner une adresse email valide.");
    return;
  }
  const confirmBtn = document.getElementById('confirmOrderBtn');
  if(confirmBtn){ confirmBtn.disabled = true; confirmBtn.textContent = 'Envoi en cours…'; } // évite le double-clic / double commande
  const order = {
    id: 'BRUT-' + Date.now().toString().slice(-8),
    items: cart.map(c=>{ const p = PRODUCTS.find(x=>x.id===c.id); return {name:p.name, color:c.color, size:c.size, price:finalPriceGNF(p), qty:c.qty, deliveryDelay:getDeliveryDelay(p)}; }),
    total: cartTotalEUR(),
    customer:{name,email,address,city,phone},
    payment:{method:'livraison'},
    deliverySummary: cartDeliverySummary(),
    date: new Date().toISOString()
  };
  const saved = await saveOrder(order);
  if(!saved){
    if(confirmBtn){ confirmBtn.disabled = false; confirmBtn.textContent = 'Confirmer — '+formatPrice(cartTotalEUR()); }
    return;
  }
  await decrementStockForOrder(cart);
  // La notification Discord est envoyée côté serveur (voir edge-function-notify-order.md), plus depuis le navigateur.
  cart = [];
  await saveCart();
  updateCartCount();
  route = {name:'confirmation', param:order};
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
// Décrémente le stock par taille après une commande réussie. Fait au mieux, sans
// verrou de concurrence (deux commandes simultanées sur le dernier exemplaire
// pourraient toutes les deux passer) — acceptable pour une petite boutique, mais
// à garder en tête. Les articles sans tailles ne sont pas touchés automatiquement :
// l'admin gère leur statut "En stock / Épuisé" manuellement.
async function decrementStockForOrder(items){
  if(!sb) return;
  const touched = new Set();
  for(const c of items){
    const p = PRODUCTS.find(x=>x.id===c.id);
    if(!p || !p.sizes || !p.sizes.length || !c.size) continue;
    const s = p.sizes.find(x=>x.size===c.size);
    if(s) s.qty = Math.max(0, s.qty - c.qty);
    touched.add(p.id);
  }
  for(const id of touched){
    const p = PRODUCTS.find(x=>x.id===id);
    try{ await sb.from('products').update({sizes:p.sizes}).eq('id', id); }
    catch(e){ console.error('Erreur mise à jour du stock', e); }
  }
}
async function toggleStock(id){
  if(!sb) return noDbWarning();
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  p.stock = !p.stock;
  const {error} = await sb.from('products').update({stock:p.stock}).eq('id', id);
  if(error){ console.error(error); alert("La mise à jour du stock a échoué. Réessaie dans un instant."); p.stock = !p.stock; }
  render();
}
// Marque/démarque un article comme "mis en avant" sur la page d'accueil
async function toggleFeatured(id){
  if(!sb) return noDbWarning();
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  p.featured = !p.featured;
  const {error} = await sb.from('products').update({featured:p.featured}).eq('id', id);
  if(error){ console.error(error); alert("La mise à jour a échoué. Réessaie dans un instant."); p.featured = !p.featured; }
  render();
}
async function editDiscount(id){
  if(!sb) return noDbWarning();
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  const input = prompt('Pourcentage de remise (0 à 90, laisser 0 pour aucune remise) :', p.discountPercent || 0);
  if(input === null) return;
  const pct = parseFloat(input);
  if(isNaN(pct) || pct < 0 || pct > 90){
    alert("Merci d'entrer un pourcentage valide entre 0 et 90.");
    return;
  }
  p.discountPercent = pct;
  const {error} = await sb.from('products').update({discount_percent:pct}).eq('id', id);
  if(error){ console.error(error); alert("La mise à jour de la remise a échoué. Réessaie dans un instant."); }
  render();
}
async function editProductDelay(id){
  if(!sb) return noDbWarning();
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  const input = prompt('Délai de livraison pour cet article (laisser vide pour utiliser le délai par défaut : "'+settings.deliveryDelay+'") :', p.deliveryDelay || '');
  if(input === null) return;
  p.deliveryDelay = input.trim().slice(0, 120) || null;
  const {error} = await sb.from('products').update({delivery_delay:p.deliveryDelay}).eq('id', id);
  if(error){ console.error(error); alert("La mise à jour du délai a échoué. Réessaie dans un instant."); }
  render();
}
async function deleteProduct(id){
  if(!sb) return noDbWarning();
  if(!confirm('Supprimer cet article du catalogue ?')) return;
  const {error} = await sb.from('products').delete().eq('id', id);
  if(error){ console.error(error); alert("La suppression a échoué. Réessaie dans un instant."); return; }
  PRODUCTS = PRODUCTS.filter(p=>p.id!==id);
  sanitizeCart();
  updateCartCount();
  render();
}
async function addProduct(){
  if(!sb) return noDbWarning();
  const name = document.getElementById('apName').value.trim().slice(0, 100);
  const cat = document.getElementById('apCat').value;
  const price = parseFloat(document.getElementById('apPrice').value);
  const discountRaw = document.getElementById('apDiscount').value;
  const discountPercent = discountRaw ? Math.min(90, Math.max(0, parseFloat(discountRaw) || 0)) : 0;
  const deliveryDelayRaw = document.getElementById('apDeliveryDelay').value.trim().slice(0, 120);
  const colorsRaw = document.getElementById('apColors').value.trim().slice(0, 200);
  const colors = colorsRaw ? colorsRaw.split(',').map(c=>c.trim().slice(0,30)).filter(Boolean).slice(0,10) : [];
  const stock = document.getElementById('apStock').checked;
  const featured = document.getElementById('apFeatured').checked;
  const sizes = apSizesDraft
    .filter(r=>r.size && r.size.trim())
    .map(r=>({size:r.size.trim().slice(0,10), qty:Math.max(0, parseInt(r.qty,10)||0)}));
  if(!name || isNaN(price) || price<0){
    alert('Merci de renseigner un nom et un prix valides.');
    return;
  }
  const newProduct = {id:'p'+Date.now(), name, cat, priceGNF:price, discountPercent, deliveryDelay: deliveryDelayRaw || null, badge:'NOUVEAU', featured, icon:CAT_ICON[cat] || 'box', images: pendingImages.slice(), stock, sizes, colors, desc:''};
  const {error} = await sb.from('products').insert(productToRow(newProduct));
  if(error){ console.error(error); alert("L'ajout a échoué. Réessaie dans un instant."); return; }
  PRODUCTS.push(newProduct);
  pendingImages = [];
  apSizesDraft = [{size:'', qty:0}];
  navigate('admin');
}
async function editSizes(id){
  if(!sb) return noDbWarning();
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  const input = prompt('Tailles et quantités, format "Taille:Quantité" séparées par des virgules (ex: S:5, M:8, L:0) :', sizesToInput(p.sizes));
  if(input === null) return;
  p.sizes = parseSizesInput(input).slice(0, 15);
  const {error} = await sb.from('products').update({sizes:p.sizes}).eq('id', id);
  if(error){ console.error(error); alert("La mise à jour des tailles a échoué. Réessaie dans un instant."); }
  render();
}
async function saveWebhook(){
  if(!sb) return noDbWarning();
  const val = document.getElementById('webhookUrl').value.trim();
  if(val && !/^https:\/\//i.test(val)){
    alert("L'URL du webhook doit commencer par https://");
    return;
  }
  const previous = settings.webhookUrl;
  settings.webhookUrl = val;
  const {error} = await sb.from('admin_settings').update({webhook_url:settings.webhookUrl}).eq('id', 1);
  if(error){ console.error(error); settings.webhookUrl = previous; alert("L'enregistrement a échoué. Réessaie dans un instant."); return; }
  alert('Webhook enregistré.');
}
async function saveDeliveryDelay(){
  if(!sb) return noDbWarning();
  const val = document.getElementById('deliveryDelayInput').value.trim().slice(0, 120);
  const previous = settings.deliveryDelay;
  settings.deliveryDelay = val || '2 à 14 jours';
  const {error} = await sb.from('settings').update({delivery_delay:settings.deliveryDelay}).eq('id', 1);
  if(error){ console.error(error); settings.deliveryDelay = previous; alert("L'enregistrement a échoué. Réessaie dans un instant."); render(); return; }
  alert('Délai de livraison enregistré.');
  render();
}
async function adminLogin(){
  if(!sb) return noDbWarning();
  const password = document.getElementById('adminPassword').value;
  if(!password){ alert('Merci de renseigner le mot de passe.'); return; }
  const {error} = await sb.auth.signInWithPassword({email: ADMIN_EMAIL, password});
  if(error){ console.error(error); alert('Connexion refusée. Vérifie le mot de passe.'); return; }
  isAdmin = true;
  await loadAdminSettings();
  await loadOrders();
  navigate('admin');
}
async function adminLogout(){
  if(sb) await sb.auth.signOut();
  isAdmin = false;
  ORDERS = []; // on ne garde pas les données clients en mémoire une fois déconnecté
  navigate('home');
}

// ================= RENDU =================
function applyTranslations(){
  const map = {
    navHome:'home', navShop:'shop', footExploreTitle:'explore', footPolicyTitle:'policy', footSupportTitle:'support',
    lblAccessibility:'lblAccessibility', lblCookies:'lblCookies', lblPrivacy:'lblPrivacy',
    lblShipping:'lblShipping', lblTerms:'lblTerms', lblFaq:'lblFaq', lblContact:'lblContact', lblReturns:'lblReturns'
  };
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = t(map[id]);
  });
  const proBtn = document.getElementById('proAccessBtn');
  if(proBtn) proBtn.textContent = t('proAccess');
  const copyright = document.getElementById('footCopyright');
  if(copyright) copyright.textContent = t('copyright');
  const langPick = document.getElementById('langPick');
  if(langPick) langPick.value = currentLang;
  const currencyPick = document.getElementById('currencyPick');
  if(currencyPick) currencyPick.value = currentCurrency;
}

function render(){
  const app = document.getElementById('app');
  let html = '';

  if(route.name==='admin' && !isAdmin){
    html = renderLock();
  } else if(route.name==='home') html = renderHome();
  else if(route.name==='shop') html = renderShop();
  else if(route.name==='product') html = renderProduct(route.param);
  else if(route.name==='cart') html = renderCart();
  else if(route.name==='checkout') html = renderCheckout();
  else if(route.name==='confirmation') html = renderConfirmation(route.param);
  else if(route.name==='admin') html = renderAdmin();
  else if(['faq','contact','returns','accessibility','cookies','privacy','shipping','terms'].includes(route.name)) html = renderStatic(route.name);
  else html = renderHome();

  app.innerHTML = html;
  updateCartCount();
  applyTranslations();

  document.querySelectorAll('#navLinks button[data-route]').forEach(b=>{
    const r = b.getAttribute('data-route');
    const isShopFamily = r==='shop' && (route.name==='shop' || route.name==='product');
    b.classList.toggle('active', route.name===r || isShopFamily);
  });

  // note : la navigation des boutons persistants (header/footer) est gérée par délégation plus bas, une seule fois
  app.querySelectorAll('[data-goto-product]').forEach(el=>{
    el.addEventListener('click', ()=> navigate('product', el.getAttribute('data-goto-product')));
  });
  app.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click', ()=>{ addToCart(b.getAttribute('data-add'), null, null); navigate('cart'); }));
  app.querySelectorAll('[data-add-with-colors]').forEach(b=>b.addEventListener('click', ()=>addToCartWithColors(b.getAttribute('data-add-with-colors'))));
  app.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.getAttribute('data-inc'), b.getAttribute('data-color')||null, b.getAttribute('data-size')||null, 1)));
  app.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.getAttribute('data-dec'), b.getAttribute('data-color')||null, b.getAttribute('data-size')||null, -1)));
  app.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click', ()=>removeItem(b.getAttribute('data-remove'), b.getAttribute('data-color')||null, b.getAttribute('data-size')||null)));
  app.querySelectorAll('[data-pd-size]').forEach(b=>b.addEventListener('click', ()=>{ pdSelectedSize = b.getAttribute('data-pd-size'); render(); }));
  app.querySelectorAll('[data-pd-thumb]').forEach(b=>b.addEventListener('click', ()=>{ pdImageIndex = parseInt(b.getAttribute('data-pd-thumb'),10) || 0; render(); }));
  app.querySelectorAll('[data-pd-zoom-open]').forEach(b=>b.addEventListener('click', ()=>{ pdLightboxOpen = true; pdLightboxIndex = pdImageIndex; render(); }));
  app.querySelectorAll('[data-pd-lightbox-close]').forEach(b=>b.addEventListener('click', (e)=>{ if(e.target===e.currentTarget){ pdLightboxOpen = false; render(); } }));
  app.querySelectorAll('[data-pd-lightbox-prev]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); const p=PRODUCTS.find(x=>x.id===route.param); const n=(p&&p.images)?p.images.length:0; if(n) pdLightboxIndex = (pdLightboxIndex - 1 + n) % n; render(); }));
  app.querySelectorAll('[data-pd-lightbox-next]').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation(); const p=PRODUCTS.find(x=>x.id===route.param); const n=(p&&p.images)?p.images.length:0; if(n) pdLightboxIndex = (pdLightboxIndex + 1) % n; render(); }));
  app.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click', ()=>toggleStock(b.getAttribute('data-toggle'))));
  app.querySelectorAll('[data-featured]').forEach(b=>b.addEventListener('click', ()=>toggleFeatured(b.getAttribute('data-featured'))));
  app.querySelectorAll('[data-discount]').forEach(b=>b.addEventListener('click', ()=>editDiscount(b.getAttribute('data-discount'))));
  app.querySelectorAll('[data-delay]').forEach(b=>b.addEventListener('click', ()=>editProductDelay(b.getAttribute('data-delay'))));
  app.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>deleteProduct(b.getAttribute('data-del'))));
  app.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click', ()=>{ shopFilter=b.getAttribute('data-filter'); shopPage=1; render(); }));
  app.querySelectorAll('[data-shop-page]').forEach(b=>b.addEventListener('click', ()=>{ shopPage = parseInt(b.getAttribute('data-shop-page'),10) || 1; render(); window.scrollTo({top:0, behavior:'instant'}); }));
  app.querySelectorAll('[data-admin-page]').forEach(b=>b.addEventListener('click', ()=>{ adminPage = parseInt(b.getAttribute('data-admin-page'),10) || 1; render(); }));
  app.querySelectorAll('[data-orders-page]').forEach(b=>b.addEventListener('click', ()=>{ ordersPage = parseInt(b.getAttribute('data-orders-page'),10) || 1; render(); }));
  app.querySelectorAll('[data-order-toggle]').forEach(b=>b.addEventListener('click', ()=>{ const id = b.getAttribute('data-order-toggle'); expandedOrderId = expandedOrderId===id ? null : id; render(); }));
  app.querySelectorAll('[data-order-status]').forEach(sel=>sel.addEventListener('click', e=>e.stopPropagation()));
  app.querySelectorAll('[data-order-status]').forEach(sel=>sel.addEventListener('change', e=>{ e.stopPropagation(); updateOrderStatus(sel.getAttribute('data-order-status'), sel.value); }));
  { const statusFilterSel = document.getElementById('ordersStatusFilter');
    if(statusFilterSel) statusFilterSel.addEventListener('change', e=>{ ordersStatusFilter = e.target.value; ordersPage = 1; render(); });
  }
  { const ordersSearchInput = document.getElementById('ordersSearchInput');
    if(ordersSearchInput){
      ordersSearchInput.addEventListener('input', (e)=>{
        ordersSearch = e.target.value;
        ordersPage = 1;
        const caret = e.target.selectionStart;
        render();
        const el = document.getElementById('ordersSearchInput');
        if(el){ el.focus(); el.setSelectionRange(caret, caret); }
      });
    }
  }
  app.querySelectorAll('[data-faq-toggle]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = b.getAttribute('data-faq-toggle');
      const ans = document.getElementById('faqAnswer'+i);
      const icon = document.getElementById('faqIcon'+i);
      const isOpen = !ans.classList.contains('hidden');
      ans.classList.toggle('hidden', isOpen);
      icon.textContent = isOpen ? '+' : '−';
    });
  });

  const confirmBtn = document.getElementById('confirmOrderBtn');
  if(confirmBtn) confirmBtn.addEventListener('click', submitOrder);
  const addProductBtn = document.getElementById('addProductBtn');
  if(addProductBtn) addProductBtn.addEventListener('click', addProduct);
  const saveWebhookBtn = document.getElementById('saveWebhookBtn');
  if(saveWebhookBtn) saveWebhookBtn.addEventListener('click', saveWebhook);
  const saveDeliveryBtn = document.getElementById('saveDeliveryBtn');
  if(saveDeliveryBtn) saveDeliveryBtn.addEventListener('click', saveDeliveryDelay);
  const unlockBtn = document.getElementById('unlockBtn');
  if(unlockBtn) unlockBtn.addEventListener('click', adminLogin);
  const adminLogoutBtn = document.getElementById('adminLogoutBtn');
  if(adminLogoutBtn) adminLogoutBtn.addEventListener('click', adminLogout);

  const apImage = document.getElementById('apImage');
  if(apImage){
    apImage.addEventListener('change', (e)=>{
      const files = Array.from(e.target.files || []).slice(0, 4 - pendingImages.length);
      if(!files.length) return;
      Promise.all(files.map(f=>resizeImageFile(f, 1200, 0.75).catch(()=>null))).then(results=>{
        results.filter(Boolean).forEach(dataUrl=>{ if(pendingImages.length < 4) pendingImages.push(dataUrl); });
        renderImagePreview();
      });
      e.target.value = ''; // permet de resélectionner les mêmes fichiers si besoin
    });
  }
  renderImagePreview();

  // ---- Recherche admin (filtre le tableau par nom/catégorie en direct) ----
  const adminSearchInput = document.getElementById('adminSearchInput');
  if(adminSearchInput){
    adminSearchInput.addEventListener('input', (e)=>{
      adminSearch = e.target.value;
      adminPage = 1;
      const caret = e.target.selectionStart;
      render();
      const el = document.getElementById('adminSearchInput');
      if(el){ el.focus(); el.setSelectionRange(caret, caret); }
    });
  }

  // ---- Tailles dynamiques du formulaire "Ajouter un article" ----
  bindSizeRowEvents();
  const addSizeRowBtn = document.getElementById('addSizeRowBtn');
  if(addSizeRowBtn) addSizeRowBtn.addEventListener('click', ()=>{ apSizesDraft.push({size:'', qty:0}); renderSizesRows(); });
  document.querySelectorAll('[data-sizes]').forEach(b=>b.addEventListener('click', ()=>editSizes(b.getAttribute('data-sizes'))));
}
function bindSizeRowEvents(){
  const sizesRowsEl = document.getElementById('apSizesRows');
  if(!sizesRowsEl) return;
  sizesRowsEl.querySelectorAll('.ap-size-name').forEach(inp=>{
    inp.addEventListener('input', ()=>{ apSizesDraft[parseInt(inp.getAttribute('data-size-idx'),10)].size = inp.value; });
  });
  sizesRowsEl.querySelectorAll('.ap-size-qty').forEach(inp=>{
    inp.addEventListener('input', ()=>{ apSizesDraft[parseInt(inp.getAttribute('data-size-idx'),10)].qty = inp.value; });
  });
  sizesRowsEl.querySelectorAll('[data-remove-size-row]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = parseInt(b.getAttribute('data-remove-size-row'),10);
      apSizesDraft.splice(i,1);
      if(!apSizesDraft.length) apSizesDraft = [{size:'', qty:0}];
      renderSizesRows();
    });
  });
}
// Ne redessine que le bloc "tailles" du formulaire admin, sans toucher au reste
// (évite d'effacer les autres champs déjà remplis par l'admin).
function renderSizesRows(){
  const sizesRowsEl = document.getElementById('apSizesRows');
  if(!sizesRowsEl) return;
  sizesRowsEl.innerHTML = apSizesDraft.map((row,i)=>`
    <div class="admin-size-row">
      <input type="text" class="ap-size-name" data-size-idx="${i}" placeholder="Ex: M" maxlength="10" value="${escapeHtml(row.size)}">
      <input type="number" class="ap-size-qty" data-size-idx="${i}" min="0" placeholder="Qté" value="${row.qty || ''}">
      <button type="button" data-remove-size-row="${i}" title="Retirer cette taille">✕</button>
    </div>
  `).join('');
  bindSizeRowEvents();
}
// Affiche la bande de miniatures des photos en attente d'ajout (formulaire admin), avec bouton de suppression par photo
function renderImagePreview(){
  const preview = document.getElementById('apImagePreview');
  if(!preview) return;
  preview.innerHTML = pendingImages.map((img,i)=>`
    <div class="img-preview-item">
      <img src="${img}">
      <button type="button" data-remove-pending-img="${i}" aria-label="Retirer cette photo">✕</button>
    </div>
  `).join('');
  preview.querySelectorAll('[data-remove-pending-img]').forEach(b=>{
    b.addEventListener('click', ()=>{
      pendingImages.splice(parseInt(b.getAttribute('data-remove-pending-img'),10), 1);
      renderImagePreview();
    });
  });
}

document.addEventListener('click', (e)=>{
  const routeBtn = e.target.closest('[data-route]');
  if(routeBtn){
    const filterVal = routeBtn.getAttribute('data-filter');
    if(filterVal){ shopFilter = filterVal; shopPage = 1; }
    navigate(routeBtn.getAttribute('data-route'));
  }
});
document.getElementById('proAccessBtn').addEventListener('click', ()=>{
  navigate('admin');
});
document.getElementById('currencyPick').addEventListener('change', (e)=>{
  currentCurrency = e.target.value;
  render();
});
document.getElementById('langPick').addEventListener('change', (e)=>{
  currentLang = e.target.value;
  render();
});

// ================= INIT =================
(async function init(){
  render(); // affichage immédiat avec les valeurs par défaut, sans attendre le stockage
  if(!sb) noDbWarning();
  await loadProducts();
  await loadCart();
  sanitizeCart();
  await loadSettings();
  if(sb){
    try{
      const {data:{session}} = await sb.auth.getSession();
      if(session){ isAdmin = true; await loadAdminSettings(); await loadOrders(); }
    }catch(e){ /* pas de session active */ }
  }
  render();
  detectCurrencyByCountry();
})();
</script>
